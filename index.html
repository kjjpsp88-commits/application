<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>आवेदन फॉर्म</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f1f5f9;
  color:#172033;
  min-height:100vh;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
  text-align:center;
  padding:24px 15px;
  box-shadow:0 4px 15px #0002;
}

.header h1{
  font-size:25px;
  margin-bottom:7px;
}

.header p{
  font-size:14px;
  opacity:.95;
}

/* CONTAINER */

.container{
  width:94%;
  max-width:650px;
  margin:25px auto;
}

/* CARD */

.card{
  background:#fff;
  padding:24px;
  border-radius:20px;
  box-shadow:0 8px 30px #00000012;
}

/* SECTION */

.section{
  font-size:18px;
  font-weight:bold;
  margin:8px 0 18px;
  padding-bottom:10px;
  border-bottom:1px solid #e5e7eb;
}

/* FIELD */

.field{
  margin-bottom:17px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:11px;
  font-size:15px;
  outline:none;
  background:#fff;
  color:#172033;
  transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px #2563eb18;
}

textarea{
  height:100px;
  resize:none;
}

/* UPLOAD */

.upload{
  padding:18px;
  border:2px dashed #cbd5e1;
  border-radius:13px;
  background:#f8fafc;
  text-align:center;
}

.upload input{
  border:0;
  padding:5px;
  background:transparent;
}

.file-name{
  margin-top:9px;
  font-size:13px;
  color:#475569;
  word-break:break-word;
}

/* PREVIEW */

.preview{
  display:none;
  margin-top:12px;
}

.preview img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid #e5e7eb;
}

/* BUTTON */

.submit{
  width:100%;
  padding:16px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px #2563eb40;
}

.submit:active{
  transform:scale(.98);
}

.submit:disabled{
  background:#94a3b8;
  box-shadow:none;
  cursor:not-allowed;
}

/* STATUS */

.status{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  font-weight:bold;
  line-height:1.5;
  min-height:20px;
}

.success{
  color:#16a34a;
}

.error{
  color:#dc2626;
}

.loading{
  color:#2563eb;
}

/* NOTE */

.note{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  background:#eff6ff;
  color:#1e40af;
  font-size:12px;
  line-height:1.5;
}

/* MOBILE */

@media(max-width:480px){

  .container{
    width:94%;
    margin:18px auto;
  }

  .card{
    padding:18px;
    border-radius:17px;
  }

  .header{
    padding:20px 12px;
  }

  .header h1{
    font-size:22px;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <h1>📋 आवेदन फॉर्म</h1>

  <p>
    कृपया अपनी जानकारी सही-सही भरें
  </p>

</div>


<!-- MAIN -->

<div class="container">

<div class="card">


<!-- PERSONAL -->

<div class="section">
👤 व्यक्तिगत जानकारी
</div>


<div class="field">

<label>
पूरा नाम *
</label>

<input
id="name"
type="text"
placeholder="अपना पूरा नाम"
autocomplete="name">

</div>


<div class="field">

<label>
मोबाइल नंबर *
</label>

<input
id="mobile"
type="tel"
maxlength="10"
inputmode="numeric"
placeholder="10 अंकों का मोबाइल नंबर"
autocomplete="tel">

</div>


<div class="field">

<label>
ईमेल
</label>

<input
id="email"
type="email"
placeholder="example@gmail.com"
autocomplete="email">

</div>


<div class="field">

<label>
तारीख *
</label>

<input
id="date"
type="date">

</div>


<div class="field">

<label>
सेवा *
</label>

<select id="service">

<option value="">
सेवा चुनें
</option>

<option value="PAN Card Apply">
PAN Card Apply
</option>

<option value="जाति प्रमाण पत्र">
जाति प्रमाण पत्र
</option>

<option value="निवास प्रमाण पत्र">
निवास प्रमाण पत्र
</option>

<option value="जन्म प्रमाण पत्र">
जन्म प्रमाण पत्र
</option>

<option value="Bank Account Opening">
Bank Account Opening
</option>

<option value="अन्य">
अन्य
</option>

</select>

</div>


<div class="field">

<label>
पूरा पता *
</label>

<textarea
id="address"
placeholder="अपना पूरा पता लिखें">
</textarea>

</div>


<!-- PHOTO -->

<div class="section">
📸 फोटो अपलोड करें
</div>


<div class="upload">

<input
id="photo"
type="file"
accept="image/*">

<div
id="photoName"
class="file-name">

कोई फोटो चयनित नहीं

</div>


<div
id="preview"
class="preview">

<img
id="previewImg"
alt="Photo Preview">

</div>

</div>


<!-- DOCUMENT -->

<div
class="section"
style="margin-top:25px">

📎 दस्तावेज़ अपलोड करें

</div>


<div class="upload">

<input
id="document"
type="file"
accept="image/*,.pdf">

<div
id="documentName"
class="file-name">

कोई दस्तावेज़ चयनित नहीं

</div>

</div>


<!-- SUBMIT -->

<button
class="submit"
id="submitBtn"
type="button"
onclick="submitApplication()">

✅ आवेदन जमा करें

</button>


<!-- STATUS -->

<div
id="status"
class="status">
</div>


<div class="note">

🔒 आपकी जानकारी आवेदन प्रक्रिया के लिए उपयोग की जाएगी।
फोटो और दस्तावेज़ केवल आपके आवेदन के साथ भेजे जाएंगे।

</div>


</div>
</div>


<script>

/* ==================================================
   APPS SCRIPT WEB APP URL
   ================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyK4lWkUH3J-9AWDK4ZKRhNetXrtlFJknbRtsA0d-xLuley7nCK4S_VochcY_Fgh1aP8g/exec";


let photoFile = null;
let documentFile = null;


/* ==================================================
   PHOTO
   ================================================== */

document
.getElementById("photo")
.addEventListener("change",function(){

  photoFile = this.files[0];

  if(!photoFile){
    return;
  }


  document
  .getElementById("photoName")
  .innerText = photoFile.name;


  const reader =
  new FileReader();


  reader.onload =
  function(e){

    document
    .getElementById("previewImg")
    .src = e.target.result;


    document
    .getElementById("preview")
    .style.display = "block";

  };


  reader.readAsDataURL(photoFile);

});


/* ==================================================
   DOCUMENT
   ================================================== */

document
.getElementById("document")
.addEventListener("change",function(){

  documentFile = this.files[0];

  if(!documentFile){
    return;
  }


  document
  .getElementById("documentName")
  .innerText =
  documentFile.name;

});


/* ==================================================
   FILE TO BASE64
   ================================================== */

function fileToBase64(file){

  return new Promise(
    function(resolve,reject){

      if(!file){

        resolve("");

        return;
      }


      const reader =
      new FileReader();


      reader.onload =
      function(){

        const result =
        reader.result;


        const base64 =
        result
        .split(",")[1];


        resolve(base64);

      };


      reader.onerror =
      function(){

        reject(
          new Error(
            "File read नहीं हो सकी"
          )
        );

      };


      reader.readAsDataURL(file);

    }
  );

}


/* ==================================================
   STATUS
   ================================================== */

function showStatus(message,type){

  const status =
  document.getElementById("status");


  status.innerText =
  message;


  status.className =
  "status " + type;

}


/* ==================================================
   SUBMIT APPLICATION
   ================================================== */

async function submitApplication(){

  const name =
  document
  .getElementById("name")
  .value
  .trim();


  const mobile =
  document
  .getElementById("mobile")
  .value
  .trim();


  const email =
  document
  .getElementById("email")
  .value
  .trim();


  const date =
  document
  .getElementById("date")
  .value;


  const service =
  document
  .getElementById("service")
  .value;


  const address =
  document
  .getElementById("address")
  .value
  .trim();


  /* REQUIRED */

  if(
    !name ||
    !mobile ||
    !date ||
    !service ||
    !address
  ){

    showStatus(
      "⚠️ कृपया सभी जरूरी जानकारी भरें।",
      "error"
    );

    return;
  }


  /* MOBILE */

  if(
    !/^[0-9]{10}$/.test(mobile)
  ){

    showStatus(
      "⚠️ सही 10 अंकों का मोबाइल नंबर डालें।",
      "error"
    );

    return;
  }


  /* URL */

  if(
    !API_URL
  ){

    showStatus(
      "❌ Apps Script URL उपलब्ध नहीं है।",
      "error"
    );

    return;
  }


  const button =
  document.getElementById("submitBtn");


  button.disabled = true;


  button.innerText =
  "⏳ आवेदन जमा हो रहा है...";


  showStatus(
    "कृपया प्रतीक्षा करें...",
    "loading"
  );


  try{

    /* FILES */

    const photoBase64 =
    await fileToBase64(photoFile);


    const documentBase64 =
    await fileToBase64(documentFile);


    /* DATA */

    const data = {

      name:name,

      mobile:mobile,

      email:email,

      date:date,

      service:service,

      address:address,


      photoBase64:
      photoBase64,

      photoName:
      photoFile
      ? photoFile.name
      : "",

      photoType:
      photoFile
      ? photoFile.type
      : "",


      documentBase64:
      documentBase64,

      documentName:
      documentFile
      ? documentFile.name
      : "",

      documentType:
      documentFile
      ? documentFile.type
      : ""

    };


    /* SEND TO APPS SCRIPT */

    const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:
        JSON.stringify(data)
      }
    );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    /* RESPONSE */

    const text =
    await response.text();


    let result;


    try{

      result =
      JSON.parse(text);

    }catch(e){

      throw new Error(
        "Apps Script से सही JSON response नहीं मिला।"
      );

    }


    /* SUCCESS */

    if(
      result &&
      result.success
    ){

      showStatus(
        "✅ आपका आवेदन सफलतापूर्वक जमा हो गया!",
        "success"
      );


      /* RESET */

      document
      .getElementById("name")
      .value = "";


      document
      .getElementById("mobile")
      .value = "";


      document
      .getElementById("email")
      .value = "";


      document
      .getElementById("date")
      .value = "";


      document
      .getElementById("service")
      .value = "";


      document
      .getElementById("address")
      .value = "";


      document
      .getElementById("photo")
      .value = "";


      document
      .getElementById("document")
      .value = "";


      document
      .getElementById("preview")
      .style.display = "none";


      document
      .getElementById("photoName")
      .innerText =
      "कोई फोटो चयनित नहीं";


      document
      .getElementById("documentName")
      .innerText =
      "कोई दस्तावेज़ चयनित नहीं";


      photoFile = null;

      documentFile = null;

    }


    /* ERROR FROM SERVER */

    else{

      showStatus(
        "❌ " +
        (
          result.message ||
          "आवेदन जमा नहीं हुआ।"
        ),
        "error"
      );

    }


  }


  catch(error){

    console.error(error);


    showStatus(
      "❌ Upload error: " +
      error.message,
      "error"
    );

  }


  button.disabled = false;


  button.innerText =
  "✅ आवेदन जमा करें";

}

</script>

</body>
</html>
